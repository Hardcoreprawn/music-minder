# cargo-deny configuration for Music Minder
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Security vulnerability database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"
yanked = "warn"
notice = "warn"
ignore = [
    # instant is unmaintained but still widely used, and we only use it indirectly via parking_lot
    "RUSTSEC-2020-0168",
]

[licenses]
# We allow permissive licenses for dependencies
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "0BSD",
]
copyleft = "warn"
allow-osi-fsf-free = "both"
default = "deny"
confidence-threshold = 0.8

# Windows system crates use a proprietary Microsoft license that cargo-deny flags by default.
# These are essential for Windows platform support and are acceptable to use.
[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Multiple versions are common in large dependency trees
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

# Known duplicate versions that are acceptable (different version requirements from different crates)
[[bans.skip]]
name = "thiserror"
version = "*"

[[bans.skip]]
name = "thiserror-impl"
version = "*"

[sources]
# Only use crates from crates.io and git
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
