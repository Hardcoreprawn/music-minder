[workspace]
members = [
    "crates/music-minder",
    "crates/symphonium",
    "crates/discographer",
    "crates/music_journo",
    "crates/soundstore",
]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2024"
authors = ["Hardcoreprawn"]
license = "MIT"
repository = "https://github.com/Hardcoreprawn/music-minder"

# Shared dependencies to avoid duplication
[workspace.dependencies]
anyhow = "1.0.100"
bitflags = "2.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
dirs = "6.0"
discographer = { path = "crates/discographer" }
futures = "0.3.31"
iced = { version = "0.13.1", features = ["tokio", "canvas", "image"] }
image = "0.25"
lofty = "0.22.4"
musicographer = { path = "crates/music_journo" }
rand = "0.9"
rayon = "1.10"
reqwest = { version = "0.12.25", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rfd = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde"] }
soundstore = { path = "crates/soundstore" }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite"] }
sha2 = "0.10"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "signal"] }
toml = "0.8"
urlencoding = "2.1"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.6"
cpal = "0.16"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "aac", "pcm"] }
rubato = "0.16"
souvlaki = "0.8"
realfft = "3.3"
rustfft = "6.2"
rtrb = "0.3"
crossbeam-channel = "0.5"
parking_lot = "0.12"
async-trait = "0.1.89"
criterion = { version = "0.5", features = ["html_reports"] }
wiremock = "0.6"

[workspace.dependencies.windows-sys]
version = "0.61"
features = ["Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console"]

[workspace.lints.clippy]
all = "warn"
nursery = "warn"
pedantic = "warn"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "unwind"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
